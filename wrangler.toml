name = "yegor-ai"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# 20 AI requests per minute per IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secret (set in the Cloudflare dashboard or with `wrangler secret put`):
#   GEMINI_API_KEY
